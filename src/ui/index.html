            "@type": "FAQPage",

              {
                "@type": "Question",
                "name": "What is wLBC?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "wLBC is an ERC-20 token on Ethereum backed 1:1 by LBRY Credits (LBC) held in custody, the same model as wBTC for Bitcoin. Contract: 0xB0F2C4f8b7c0f088f7844947EcBf1220bFCa08C1."

              },
              {
                "@type": "Question",
                "name": "How do I wrap LBC?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Connect an Ethereum wallet, send LBC to the personal deposit address shown, and after 6 LBRY confirmations mint the same amount of wLBC to your wallet."

              },
              {
                "@type": "Question",
                "name": "How do I get native LBC back?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "On the Unwrap page, burn wLBC and enter an LBRY address. After 12 Ethereum confirmations the same amount of native LBC is sent to that address."

              }
            ]

        <h1>Wrap LBC to wLBC on Ethereum</h1>
        <p>
          lbc.exchange bridges native LBRY Credits (LBC) to wLBC, an ERC-20 token on Ethereum backed 1:1 by LBC held in

          across DeFi, and redeem it for native LBC whenever you like.
        </p>
        <p>
          wLBC contract: 0xB0F2C4f8b7c0f088f7844947EcBf1220bFCa08C1. Bridge: 0xa3A3E8304C88b017153bA5dFCCDACCB7116a185f.
        </p>
